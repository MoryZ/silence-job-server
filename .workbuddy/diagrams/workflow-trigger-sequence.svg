<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 800" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#8b5cf6"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="800" fill="#fafbfc" rx="8"/>

  <!-- Title -->
  <text x="340" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">POST /api/v1/workflows/trigger 时序图</text>
  <text x="340" y="50" text-anchor="middle" font-size="11" fill="#94a3b8">Workflow 手动触发 - DAG 逐节点执行</text>

  <!-- Lifelines -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4">
    <line x1="65" y1="78" x2="65" y2="780"/>
    <line x1="175" y1="78" x2="175" y2="780"/>
    <line x1="300" y1="78" x2="300" y2="780"/>
    <line x1="430" y1="78" x2="430" y2="780"/>
    <line x1="560" y1="78" x2="560" y2="780"/>
  </g>

  <!-- Participant boxes -->
  <g filter="url(#shadow)">
    <rect x="15" y="60" width="100" height="32" rx="6" fill="#8b5cf6"/>
    <text x="65" y="81" text-anchor="middle" font-size="10" fill="white" font-weight="600">WorkflowResource</text>

    <rect x="115" y="60" width="120" height="32" rx="6" fill="#8b5cf6"/>
    <text x="175" y="81" text-anchor="middle" font-size="10" fill="white" font-weight="600">WorkflowService</text>

    <rect x="240" y="60" width="120" height="32" rx="6" fill="#3b82f6"/>
    <text x="300" y="81" text-anchor="middle" font-size="10" fill="white" font-weight="600">WfPrepareHandler</text>

    <rect x="365" y="60" width="130" height="32" rx="6" fill="#f59e0b"/>
    <text x="430" y="81" text-anchor="middle" font-size="10" fill="white" font-weight="600">WfBatchGenerator</text>

    <rect x="495" y="60" width="130" height="32" rx="6" fill="#10b981"/>
    <text x="560" y="81" text-anchor="middle" font-size="10" fill="white" font-weight="600">WfExecutorActor</text>
  </g>

  <!-- Step 1 -->
  <line x1="65" y1="108" x2="175" y2="108" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="103" text-anchor="middle" font-size="9" fill="#475569">1. trigger(triggerVO)</text>

  <!-- Step 2: DB -->
  <rect x="190" y="118" width="140" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="260" y="133" text-anchor="middle" font-size="9" fill="#92400e">2. workflowDao.selectById()</text>

  <!-- Step 3: Group check -->
  <rect x="190" y="148" width="160" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="270" y="163" text-anchor="middle" font-size="9" fill="#92400e">3. 循环检查 groupConfig</text>
  <text x="270" y="179" text-anchor="middle" font-size="8" fill="#94a3b8">每个 groupName 都需 group_status=true</text>

  <!-- Step 4: DTO -->
  <rect x="220" y="190" width="160" height="36" rx="6" fill="#f0f9ff" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="300" y="204" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="600">4. 设置 DTO</text>
  <text x="300" y="218" text-anchor="middle" font-size="8" fill="#64748b">nextTriggerAt=now</text>
  <text x="300" y="229" text-anchor="middle" font-size="8" fill="#64748b">scene=MANUAL_WORKFLOW</text>

  <!-- Step 5: → PrepareHandler -->
  <line x1="175" y1="240" x2="300" y2="240" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="237" y="235" text-anchor="middle" font-size="8" fill="#8b5cf6">5. doHandler(wfDTO)</text>

  <!-- Step 6: → BatchGenerator -->
  <line x1="300" y1="255" x2="430" y2="255" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="365" y="250" text-anchor="middle" font-size="8" fill="#3b82f6">6. generateJobTaskBatch()</text>

  <!-- Step 7: DB -->
  <rect x="400" y="267" width="170" height="30" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="485" y="280" text-anchor="middle" font-size="9" fill="#92400e">7. INSERT sj_workflow_task_batch</text>
  <text x="485" y="293" text-anchor="middle" font-size="8" fill="#94a3b8">status=WAITING</text>

  <!-- Step 8: TimerWheel -->
  <rect x="400" y="308" width="150" height="30" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="0.5"/>
  <text x="475" y="322" text-anchor="middle" font-size="9" fill="#166534">8. JobTimerWheel</text>
  <text x="475" y="335" text-anchor="middle" font-size="8" fill="#64748b">registerWithWorkflow()</text>

  <!-- Step 9: TimerTask -->
  <rect x="400" y="348" width="150" height="22" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="0.5"/>
  <text x="475" y="363" text-anchor="middle" font-size="9" fill="#166534">9. WorkflowTimerTask.run()</text>

  <!-- Step 10: → ExecutorActor -->
  <line x1="430" y1="380" x2="560" y2="380" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="495" y="375" text-anchor="middle" font-size="8" fill="#10b981">10. doExecutor()</text>

  <!-- DAG Section -->
  <rect x="60" y="400" width="560" height="320" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">DAG 逐节点执行循环</text>

  <!-- Step 11: Topology sort -->
  <rect x="120" y="432" width="200" height="24" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="220" y="448" text-anchor="middle" font-size="9" fill="#1d4ed8">11. DAG 拓扑排序 → 节点列表</text>

  <!-- Step 12: Node type dispatch -->
  <polygon points="340,475 390,495 340,515 290,495" fill="#faf5ff" stroke="#8b5cf6" stroke-width="0.5"/>
  <text x="340" y="492" text-anchor="middle" font-size="8" fill="#7c3aed">12. 节点类型</text>
  <text x="340" y="502" text-anchor="middle" font-size="8" fill="#7c3aed">判断</text>

  <!-- JOB_TASK branch -->
  <rect x="90" y="530" width="140" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="0.5"/>
  <text x="160" y="546" text-anchor="middle" font-size="9" fill="#166534" font-weight="600">JOB_TASK</text>
  <text x="160" y="562" text-anchor="middle" font-size="8" fill="#64748b">JobTaskWorkflowExecutor</text>
  <line x1="290" y1="495" x2="160" y2="530" stroke="#10b981" stroke-width="1"/>

  <!-- DECISION branch -->
  <rect x="270" y="530" width="140" height="40" rx="6" fill="#faf5ff" stroke="#c084fc" stroke-width="0.5"/>
  <text x="340" y="546" text-anchor="middle" font-size="9" fill="#7c3aed" font-weight="600">DECISION</text>
  <text x="340" y="562" text-anchor="middle" font-size="8" fill="#64748b">DecisionWorkflowExecutor</text>
  <line x1="340" y1="515" x2="340" y2="530" stroke="#8b5cf6" stroke-width="1"/>

  <!-- CALLBACK branch -->
  <rect x="450" y="530" width="140" height="40" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="0.5"/>
  <text x="520" y="546" text-anchor="middle" font-size="9" fill="#c2410c" font-weight="600">CALLBACK</text>
  <text x="520" y="562" text-anchor="middle" font-size="8" fill="#64748b">CallbackWorkflowExecutor</text>
  <line x1="390" y1="495" x2="520" y2="530" stroke="#f59e0b" stroke-width="1"/>

  <!-- JOB_TASK detail -->
  <rect x="75" y="585" width="170" height="45" rx="6" fill="white" stroke="#86efac" stroke-width="0.5"/>
  <text x="160" y="600" text-anchor="middle" font-size="8" fill="#166534">→ JobTaskBatchGenerator</text>
  <text x="160" y="613" text-anchor="middle" font-size="8" fill="#92400e">  INSERT sj_job_task_batch</text>
  <text x="160" y="626" text-anchor="middle" font-size="8" fill="#64748b">  → JobExecutorActor → RPC</text>

  <!-- Step 13: Node complete -->
  <rect x="290" y="640" width="200" height="24" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="390" y="656" text-anchor="middle" font-size="9" fill="#1d4ed8">13. mergeAllWorkflowContext()</text>

  <!-- Step 14: Open next -->
  <rect x="290" y="672" width="200" height="24" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="0.5"/>
  <text x="390" y="688" text-anchor="middle" font-size="9" fill="#166534">14. openNextNode()</text>
  <text x="390" y="701" text-anchor="middle" font-size="8" fill="#94a3b8">满足条件 → 开启下游节点</text>

  <!-- Loop arrow -->
  <path d="M490,672 Q560,660 560,495 Q560,475 540,475" stroke="#94a3b8" stroke-width="1" fill="none" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="567" y="580" font-size="8" fill="#94a3b8" transform="rotate(-90,567,580)">循环下一节点</text>

  <!-- Step 15: All done -->
  <rect x="200" y="720" width="280" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="340" y="735" text-anchor="middle" font-size="9" fill="#92400e">15. 所有节点完成 → UPDATE batch status</text>
  <text x="340" y="748" text-anchor="middle" font-size="8" fill="#94a3b8">汇总统计 + 日志合并</text>

  <!-- Legend -->
  <g transform="translate(30, 775)">
    <rect width="10" height="10" rx="2" fill="#8b5cf6"/><text x="14" y="9" font-size="8" fill="#64748b">Workflow层</text>
    <rect x="75" width="10" height="10" rx="2" fill="#10b981"/><text x="89" y="9" font-size="8" fill="#64748b">Job执行</text>
    <rect x="140" width="10" height="10" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.5"/><text x="154" y="9" font-size="8" fill="#64748b">DB操作</text>
    <rect x="205" width="10" height="10" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.5"/><text x="219" y="9" font-size="8" fill="#64748b">异步调度</text>
    <rect x="275" width="10" height="10" rx="2" fill="#faf5ff" stroke="#c084fc" stroke-width="0.5"/><text x="289" y="9" font-size="8" fill="#64748b">决策/分支</text>
  </g>
</svg>