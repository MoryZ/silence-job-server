<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 880" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="680" height="880" fill="#fafbfc" rx="8"/>

  <!-- Title bar -->
  <rect x="20" y="15" width="640" height="50" rx="8" fill="url(#headerBg)" filter="url(#shadow)"/>
  <text x="340" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="white">Silence-Job 定时任务全景图</text>
  <text x="340" y="55" text-anchor="middle" font-size="10" fill="#c7d2fe">14 个定时任务 · 4 大分类 · 统一 AbstractSchedule 基类</text>

  <!-- ===== Category 1: 核心调度 ===== -->
  <rect x="20" y="80" width="640" height="225" rx="8" fill="white" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="80" width="640" height="28" rx="8" fill="#3b82f6"/>
  <rect x="20" y="100" width="640" height="8" fill="#3b82f6"/>
  <text x="340" y="99" text-anchor="middle" font-size="11" font-weight="600" fill="white">🔄 核心调度 (4 个)</text>

  <!-- DispatchService -->
  <rect x="35" y="118" width="305" height="85" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.5"/>
  <text x="45" y="136" font-size="11" font-weight="700" fill="#1e40af">DispatchService</text>
  <rect x="240" y="124" width="90" height="16" rx="8" fill="#3b82f6"/>
  <text x="285" y="136" text-anchor="middle" font-size="9" fill="white">30s 周期</text>
  <text x="45" y="154" font-size="9" fill="#475569">定时分发 bucket 任务，驱动任务执行</text>
  <text x="45" y="168" font-size="8" fill="#94a3b8">机制: Pekko Timer + ConsumerBucketActor</text>
  <text x="45" y="182" font-size="8" fill="#f59e0b">⚡ 核心：所有任务执行的调度引擎</text>
  <text x="45" y="196" font-size="8" fill="#94a3b8">涉及: DispatchService → ConsumerBucketActor</text>

  <!-- ScanJobTaskActor -->
  <rect x="350" y="118" width="305" height="85" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.5"/>
  <text x="360" y="136" font-size="11" font-weight="700" fill="#1e40af">ScanJobTaskActor</text>
  <rect x="555" y="124" width="90" height="16" rx="8" fill="#3b82f6"/>
  <text x="600" y="136" text-anchor="middle" font-size="9" fill="white">30s 周期</text>
  <text x="360" y="154" font-size="9" fill="#475569">扫描到期 Job，创建任务批次</text>
  <text x="360" y="168" font-size="8" fill="#94a3b8">机制: AbstractSchedule + ShedLock</text>
  <text x="360" y="182" font-size="8" fill="#f59e0b">过滤: job_status=true AND nextTriggerAt≤now</text>
  <text x="360" y="196" font-size="8" fill="#94a3b8">涉及: sj_job, sj_group_config</text>

  <!-- ScanWorkflowTaskActor -->
  <rect x="35" y="212" width="305" height="85" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.5"/>
  <text x="45" y="230" font-size="11" font-weight="700" fill="#1e40af">ScanWorkflowTaskActor</text>
  <rect x="240" y="218" width="90" height="16" rx="8" fill="#3b82f6"/>
  <text x="285" y="230" text-anchor="middle" font-size="9" fill="white">30s 周期</text>
  <text x="45" y="248" font-size="9" fill="#475569">扫描到期 Workflow，创建工作流批次</text>
  <text x="45" y="262" font-size="8" fill="#94a3b8">机制: AbstractSchedule + ShedLock</text>
  <text x="45" y="276" font-size="8" fill="#f59e0b">过滤: workflow_status=true AND nextTriggerAt≤now</text>
  <text x="45" y="290" font-size="8" fill="#94a3b8">涉及: sj_workflow, sj_group_config</text>

  <!-- ScanRetryActor -->
  <rect x="350" y="212" width="305" height="85" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.5"/>
  <text x="360" y="230" font-size="11" font-weight="700" fill="#1e40af">ScanRetryActor</text>
  <rect x="555" y="218" width="90" height="16" rx="8" fill="#3b82f6"/>
  <text x="600" y="230" text-anchor="middle" font-size="9" fill="white">30s 周期</text>
  <text x="360" y="248" font-size="9" fill="#475569">扫描到期重试任务，重新分发</text>
  <text x="360" y="262" font-size="8" fill="#94a3b8">机制: AbstractSchedule + ShedLock</text>
  <text x="360" y="276" font-size="8" fill="#f59e0b">过滤: nextTriggerAt≤now AND retryCount&lt;max</text>
  <text x="360" y="290" font-size="8" fill="#94a3b8">涉及: sj_retry</text>

  <!-- ===== Category 2: 节点管理 ===== -->
  <rect x="20" y="318" width="640" height="155" rx="8" fill="white" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="318" width="640" height="28" rx="8" fill="#10b981"/>
  <rect x="20" y="338" width="640" height="8" fill="#10b981"/>
  <text x="340" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="white">🖥️ 节点管理 (2 个)</text>

  <!-- OfflineNodeSchedule -->
  <rect x="35" y="356" width="305" height="85" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.5"/>
  <text x="45" y="374" font-size="11" font-weight="700" fill="#166534">OfflineNodeSchedule</text>
  <rect x="240" y="362" width="90" height="16" rx="8" fill="#10b981"/>
  <text x="285" y="374" text-anchor="middle" font-size="9" fill="white">5s 周期</text>
  <text x="45" y="392" font-size="9" fill="#475569">清理过期下线节点，释放任务槽位</text>
  <text x="45" y="406" font-size="8" fill="#94a3b8">机制: AbstractSchedule + ShedLock</text>
  <text x="45" y="420" font-size="8" fill="#94a3b8">涉及: sj_server_node</text>
  <text x="45" y="434" font-size="8" fill="#f59e0b">确保故障节点不会永久占用资源</text>

  <!-- ClientRegister -->
  <rect x="350" y="356" width="305" height="85" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.5"/>
  <text x="360" y="374" font-size="11" font-weight="700" fill="#166534">ClientRegister</text>
  <rect x="555" y="362" width="90" height="16" rx="8" fill="#10b981"/>
  <text x="600" y="374" text-anchor="middle" font-size="9" fill="white">5s 周期</text>
  <text x="360" y="392" font-size="9" fill="#475569">客户端节点心跳续签，保持在线状态</text>
  <text x="360" y="406" font-size="8" fill="#94a3b8">机制: AbstractSchedule 继承</text>
  <text x="360" y="420" font-size="8" fill="#94a3b8">涉及: sj_group_config</text>
  <text x="360" y="434" font-size="8" fill="#f59e0b">防止客户端因心跳超时被误判下线</text>

  <!-- ===== Category 3: 统计 + 日志 ===== -->
  <rect x="20" y="486" width="640" height="225" rx="8" fill="white" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="486" width="640" height="28" rx="8" fill="#f59e0b"/>
  <rect x="20" y="506" width="640" height="8" fill="#f59e0b"/>
  <text x="340" y="505" text-anchor="middle" font-size="11" font-weight="600" fill="white">📊 统计汇总 &amp; 日志处理 (5 个)</text>

  <!-- JobSummarySchedule -->
  <rect x="35" y="524" width="200" height="75" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="0.5"/>
  <text x="45" y="542" font-size="10" font-weight="700" fill="#92400e">JobSummarySchedule</text>
  <rect x="160" y="530" width="65" height="14" rx="7" fill="#f59e0b"/>
  <text x="192" y="541" text-anchor="middle" font-size="8" fill="white">1min</text>
  <text x="45" y="558" font-size="9" fill="#475569">Job 统计汇总</text>
  <text x="45" y="572" font-size="8" fill="#94a3b8">涉及: sj_job_summary</text>
  <text x="45" y="586" font-size="8" fill="#94a3b8">聚合执行次数/成功率</text>

  <!-- WfJobSummarySchedule -->
  <rect x="245" y="524" width="200" height="75" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="0.5"/>
  <text x="255" y="542" font-size="10" font-weight="700" fill="#92400e">WfJobSummarySchedule</text>
  <rect x="370" y="530" width="65" height="14" rx="7" fill="#f59e0b"/>
  <text x="402" y="541" text-anchor="middle" font-size="8" fill="white">1min</text>
  <text x="255" y="558" font-size="9" fill="#475569">Workflow 统计汇总</text>
  <text x="255" y="572" font-size="8" fill="#94a3b8">涉及: sj_job_summary</text>
  <text x="255" y="586" font-size="8" fill="#94a3b8">聚合工作流维度的统计</text>

  <!-- RetrySummarySchedule -->
  <rect x="455" y="524" width="200" height="75" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="0.5"/>
  <text x="465" y="542" font-size="10" font-weight="700" fill="#92400e">RetrySummarySchedule</text>
  <rect x="580" y="530" width="65" height="14" rx="7" fill="#f59e0b"/>
  <text x="612" y="541" text-anchor="middle" font-size="8" fill="white">1min</text>
  <text x="465" y="558" font-size="9" fill="#475569">Retry 统计汇总</text>
  <text x="465" y="572" font-size="8" fill="#94a3b8">涉及: sj_job_summary</text>
  <text x="465" y="586" font-size="8" fill="#94a3b8">聚合重试维度统计</text>

  <!-- JobLogMergeSchedule -->
  <rect x="35" y="610" width="305" height="85" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="0.5"/>
  <text x="45" y="628" font-size="10" font-weight="700" fill="#92400e">JobLogMergeSchedule</text>
  <rect x="240" y="616" width="90" height="14" rx="7" fill="#f59e0b"/>
  <text x="285" y="627" text-anchor="middle" font-size="8" fill="white">1min 周期</text>
  <text x="45" y="646" font-size="9" fill="#475569">Job 日志合并，将碎片日志聚合</text>
  <text x="45" y="660" font-size="8" fill="#94a3b8">涉及: sj_log_message</text>
  <text x="45" y="674" font-size="8" fill="#f59e0b">减少日志表数据量，提升查询性能</text>
  <text x="45" y="688" font-size="8" fill="#94a3b8">机制: AbstractSchedule + ShedLock</text>

  <!-- RetryLogMergeSchedule -->
  <rect x="350" y="610" width="305" height="85" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="0.5"/>
  <text x="360" y="628" font-size="10" font-weight="700" fill="#92400e">RetryLogMergeSchedule</text>
  <rect x="555" y="616" width="90" height="14" rx="7" fill="#f59e0b"/>
  <text x="600" y="627" text-anchor="middle" font-size="8" fill="white">1h 周期</text>
  <text x="360" y="646" font-size="9" fill="#475569">Retry 日志合并</text>
  <text x="360" y="660" font-size="8" fill="#94a3b8">涉及: sj_log_message</text>
  <text x="360" y="674" font-size="8" fill="#94a3b8">频率较低，重试日志量相对少</text>
  <text x="360" y="688" font-size="8" fill="#94a3b8">机制: AbstractSchedule + ShedLock</text>

  <!-- ===== Category 4: 告警 + 清理 ===== -->
  <rect x="20" y="724" width="640" height="140" rx="8" fill="white" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="724" width="640" height="28" rx="8" fill="#ef4444"/>
  <rect x="20" y="744" width="640" height="8" fill="#ef4444"/>
  <text x="340" y="743" text-anchor="middle" font-size="11" font-weight="600" fill="white">🚨 告警 &amp; 清理 (3 个)</text>

  <!-- RetryAlarm -->
  <rect x="35" y="762" width="200" height="85" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="0.5"/>
  <text x="45" y="780" font-size="10" font-weight="700" fill="#991b1b">RetryThresholdAlarm</text>
  <rect x="160" y="768" width="65" height="14" rx="7" fill="#ef4444"/>
  <text x="192" y="779" text-anchor="middle" font-size="8" fill="white">10min</text>
  <text x="45" y="798" font-size="9" fill="#475569">重试超量/失败告警</text>
  <text x="45" y="812" font-size="8" fill="#94a3b8">涉及: sj_retry</text>
  <text x="45" y="826" font-size="8" fill="#94a3b8">含 2 个子类:</text>
  <text x="45" y="838" font-size="8" fill="#94a3b8">MoreThreshold + ErrorThreshold</text>

  <!-- JobClearLogSchedule -->
  <rect x="245" y="762" width="200" height="85" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="0.5"/>
  <text x="255" y="780" font-size="10" font-weight="700" fill="#991b1b">JobClearLogSchedule</text>
  <rect x="370" y="768" width="65" height="14" rx="7" fill="#ef4444"/>
  <text x="402" y="779" text-anchor="middle" font-size="8" fill="white">4h 周期</text>
  <text x="255" y="798" font-size="9" fill="#475569">Job 日志定期清理</text>
  <text x="255" y="812" font-size="8" fill="#94a3b8">涉及: sj_log_message</text>
  <text x="255" y="826" font-size="8" fill="#94a3b8">删除过期日志记录</text>
  <text x="255" y="838" font-size="8" fill="#94a3b8">sj_job_task_batch 清理</text>

  <!-- CleanerSchedule -->
  <rect x="455" y="762" width="200" height="85" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="0.5"/>
  <text x="465" y="780" font-size="10" font-weight="700" fill="#991b1b">CleanerSchedule</text>
  <rect x="580" y="768" width="65" height="14" rx="7" fill="#ef4444"/>
  <text x="612" y="779" text-anchor="middle" font-size="8" fill="white">4h 周期</text>
  <text x="465" y="798" font-size="9" fill="#475569">Retry 清理 + 死信迁移</text>
  <text x="465" y="812" font-size="8" fill="#94a3b8">涉及: sj_retry</text>
  <text x="465" y="826" font-size="8" fill="#94a3b8">超限重试 → 死信队列</text>
  <text x="465" y="838" font-size="8" fill="#94a3b8">sj_retry_dead_letter</text>
</svg>